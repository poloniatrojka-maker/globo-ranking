<head>
<meta charset="utf-8">

<title>Globo do ranking: 179 países</title>
<style>
:root{--bg:#f7f8f8;--surface:#e3eef0;--land:#cfd5d6;--line:#f7f8f8;--text:#14272b;--muted:#4f6165;--border:#9fb3b7}
@media (prefers-color-scheme:dark){:root{--bg:#10191b;--surface:#1b2c30;--land:#3a4749;--line:#10191b;--text:#e8f0f1;--muted:#a3b5b8;--border:#4c6469}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin:0 0 12px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted)}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover{background:var(--surface)}
button:focus-visible,input:focus-visible{outline:2px solid #2A8294;outline-offset:2px}
svg{width:100%;height:auto;display:block;cursor:grab;touch-action:none}
#lg{display:grid;grid-template-columns:repeat(3,max-content);gap:6px 24px;color:var(--muted);margin-top:8px}
#lg span{display:flex;align-items:center;gap:6px}
#lg i{width:14px;height:14px;border-radius:2px;display:inline-block}
</style>
</head>

<div class="bar">
<span>Zoom</span>
<button class="z" data-k="1">1x</button><button class="z" data-k="2">2x</button><button class="z" data-k="3">3x</button>

<span id="o" style="min-width:32px">1,0x</span>
<button id="b">Pausar rotação</button>
</div>
<svg id="g" viewBox="0 0 680 700" role="img" aria-label="Globo terrestre giratório com o ranking de países"></svg>
<div id="lg"></div>
<p style="color:var(--muted)">Arraste para girar. Use a roda de rolagem sobre o globo para dar zoom.</p>
</main>

const T=["#0A3D47","#176070","#2A8294","#7A3A08","#A9591A","#CF7F32","#3E2C6E","#5C45A0","#7C63B8","#7A1A3C","#A82E5A","#CF5C85","#1F4D2A","#3A7A3C","#5E9A47","#14295E","#2A4FA0","#5280D2"];
const col=r=>T[Math.floor((r-1)/10)];
const lg=document.getElementById("lg");
for(let i=0;i<18;i++)lg.insertAdjacentHTML("beforeend",`<span><i style="background:${T[i]}"></i>${i*10+1}º a ${Math.min(i*10+10,179)}º</span>`);
d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(w=>{
const fs=topojson.feature(w,w.objects.countries).features.filter(f=>f.properties.name!=="Antarctica");
const pts=[],seen={};
fs.forEach(f=>{const n=f.properties.name,d=D[n];if(d){seen[n]=1;pts.push({r:d[0],n:d[1],c:d[2]!==undefined?[d[2],d[3]]:d3.geoCentroid(f)})}});
Object.keys(D).forEach(n=>{if(!seen[n]){const d=D[n];if(d[2]!==undefined)pts.push({r:d[0],n:d[1],c:[d[2],d[3]]})}});
const svg=d3.select("#g"),pr=d3.geoOrthographic().translate([340,350]).clipAngle(90),path=d3.geoPath(pr);
const ocean=svg.append("circle").attr("cx",340).attr("cy",350).attr("style","fill:var(--surface);stroke:var(--border);stroke-width:.8");
const land=svg.append("g").selectAll("path").data(fs).join("path").attr("style",f=>{const d=D[f.properties.name];return `fill:${d?col(d[0]):"var(--land)"};stroke:var(--line);stroke-width:.5`});
const lab=svg.append("g");
let rot=[20,-15],paused=false,drag=false,resume=0,k=1,kT=1;
function draw(){
pr.scale(420*k).rotate(rot);ocean.attr("r",420*k);land.attr("d",path);lab.selectAll("*").remove();
const ctr=[-rot[0],-rot[1]],vis=pts.map(p=>({...p,d:d3.geoDistance(p.c,ctr)})).filter(p=>p.d<1.38).sort((a,b)=>a.d-b.d),box=[];
vis.forEach(p=>{const q=pr(p.c),x=q[0],y=q[1];
if(x<12||x>668||y<12||y>688)return;
lab.append("circle").attr("cx",x).attr("cy",y).attr("r",10).attr("style",`fill:${col(p.r)};stroke:#fff;stroke-width:1.3`);
lab.append("text").attr("x",x).attr("y",y).attr("text-anchor","middle").attr("dominant-baseline","central").attr("style","fill:#fff;font-size:11px;font-weight:500").text(p.r);
const wd=p.n.length*6.3+8,b={x1:x-10,x2:x+14+wd,y1:y-10,y2:y+10};
if(x+14+wd<676&&p.d<1.15&&!box.some(o=>b.x1<o.x2&&b.x2>o.x1&&b.y1<o.y2&&b.y2>o.y1)){box.push(b);
lab.append("text").attr("x",x+14).attr("y",y).attr("dominant-baseline","central").attr("style","fill:var(--text);stroke:var(--bg);stroke-width:3;paint-order:stroke;font-size:11px;font-weight:500").text(p.n)}else box.push({x1:x-10,x2:x+10,y1:y-10,y2:y+10})});
}
svg.call(d3.drag().on("start",()=>{drag=true;svg.style("cursor","grabbing")}).on("drag",e=>{rot[0]+=e.dx*0.2/k;rot[1]=Math.max(-65,Math.min(65,rot[1]-e.dy*0.2/k));draw()}).on("end",()=>{drag=false;resume=performance.now()+1200;svg.style("cursor","grab")}));
d3.timer(()=>{let ch=false;if(Math.abs(kT-k)>0.002){k+=(kT-k)*0.15;ch=true}
if(!paused&&!drag&&performance.now()>resume){rot[0]+=0.2/Math.sqrt(k);ch=true}
if(ch)draw()});
const s=document.getElementById("s"),o=document.getElementById("o");
const setK=v=>{v=Math.max(1,Math.min(3,+v));kT=v;s.value=v;o.textContent=v.toFixed(1).replace(".",",")+"x"};
s.oninput=e=>setK(e.target.value);
document.querySelectorAll(".z").forEach(b=>b.onclick=()=>setK(b.dataset.k));
svg.node().addEventListener("wheel",e=>{e.preventDefault();setK(kT*(e.deltaY<0?1.12:1/1.12))},{passive:false});
document.getElementById("b").onclick=e=>{paused=!paused;e.target.textContent=paused?"Retomar rotação":"Pausar rotação"};
draw();
}).catch(()=>{document.getElementById("g").insertAdjacentHTML("afterend","<p>Não foi possível carregar o mapa. Verifique a conexão com a internet.</p>")});
